name: Refresh contribution snake

on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/profile-snake.yml']

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: Akramtaha98
          outputs: |
            dist/github-snake.svg?color_snake=#7aa2f7
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#bb9af7&color_dots=#161b22,#24283b,#414868,#7aa2f7,#bb9af7
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish animations to the visuals branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, urllib.request, urllib.error
          root = 'https://api.github.com/repos/' + os.environ['REPOSITORY']
          branch = 'profile-visuals'
          def api(path, method='GET', data=None):
              request = urllib.request.Request(root + path, method=method,
                  data=json.dumps(data).encode() if data is not None else None,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          try:
              api('/git/ref/heads/' + branch)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              head = api('/git/ref/heads/main')['object']['sha']
              api('/git/refs', 'POST', {'ref': 'refs/heads/' + branch, 'sha': head})
          files = sorted(pathlib.Path('dist').glob('*.svg'))
          if len(files) != 2:
              raise RuntimeError('Expected both light and dark animations')
          for file in files:
              content = base64.b64encode(file.read_bytes()).decode()
              payload = {'message': 'Update contribution animation',
                         'branch': branch, 'content': content}
              path = '/contents/' + file.name
              try:
                  previous = api(path + '?ref=' + branch)
                  if ''.join(previous.get('content', '').split()) == content:
                      continue
                  payload['sha'] = previous['sha']
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              api(path, 'PUT', payload)
              print('Published ' + file.name)
          PY
